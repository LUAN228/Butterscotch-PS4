name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  Unix:
    uses: ./.github/workflows/build-desktop.yml
    with:
      full_matrix: ${{ github.event_name == 'push' }}

  Consoles:
    uses: ./.github/workflows/build-console.yml

  Compilers:
    uses: ./.github/workflows/build-old-compilers.yml
