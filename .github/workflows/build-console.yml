name: Console builds

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-ps4:
    name: Build (PlayStation 4 FPKG)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Build Dependencies & Tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libopenal-dev \
            libsdl2-dev \
            libgles-dev \
            libgl1-mesa-dev \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            pkg-config \
            ninja-build \
            curl \
            jq \
            build-essential \
            git \
            cmake \
            ccache \
            zip \
            unzip \
            python3

      - name: Fix GLESv3 symlink
        run: |
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libGLESv2.so /usr/lib/x86_64-linux-gnu/libGLESv3.so

      - name: Patch PS4 source for missing implementations
        run: |
          set -euxo pipefail
          if ! grep -q 'STB_IMAGE_IMPLEMENTATION' src/ps4/ps4.c; then
            printf '\n#define STB_IMAGE_IMPLEMENTATION\n#include "stb_image.h"\n#define STB_IMAGE_WRITE_IMPLEMENTATION\n#include "stb_image_write.h"\n' >> src/ps4/ps4.c
          fi
          if ! grep -q 'platformLog(const char \*fmt' src/ps4/ps4.c; then
            printf '\nvoid platformLog(const char *fmt, ...) { (void)fmt; }\n' >> src/ps4/ps4.c
          fi

      - name: Set up ccache cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-ps4-${{ github.sha }}
          restore-keys: |
            ccache-ps4-

      - name: Configure and Build Binary
        run: |
          set -euxo pipefail
          cmake -B build -G Ninja \
            -DWERROR=OFF \
            -DPLATFORM=ps4 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

          cmake --build build

      - name: Prepare PS4 package root
        run: |
          set -euxo pipefail
          mkdir -p ps4_root/sce_sys
          cp build/butterscotch ps4_root/eboot.bin

          if [ -f "data.win" ]; then
            cp data.win ps4_root/data.win
          fi

          if [ -f "icon0.png" ]; then
            cp icon0.png ps4_root/sce_sys/icon0.png
          fi

          python3 tools/ps4_make_sfo.py \
            --title "Butterscotch GameRunner" \
            --title-id "CUSA12345" \
            --version "01.00" \
            --category "gd" \
            --output ps4_root/sce_sys/param.sfo

      - name: Clone OpenOrbis Toolkit
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git oo_toolchain

      - name: Build pkggen tool
        run: |
          set -euxo pipefail
          if [ -d "oo_toolchain/tools/pkg-gen" ]; then
            cd oo_toolchain/tools/pkg-gen
            make
            cd ../../..
          fi

      - name: Create PS4 package
        run: |
          set -euxo pipefail
          if [ -f "oo_toolchain/tools/pkg-gen/pkgtool" ]; then
            ./oo_toolchain/tools/pkg-gen/pkgtool create ps4_root butterscotch_ps4.pkg
          elif [ -f "oo_toolchain/bin/pkgtool" ]; then
            ./oo_toolchain/bin/pkgtool create ps4_root butterscotch_ps4.pkg
          else
            echo "OpenOrbis pkgtool is not available; cannot create a valid PS4 FPKG without the official PS4 toolchain."
            exit 1
          fi

          test -s butterscotch_ps4.pkg
          ls -lh butterscotch_ps4.pkg

      - name: Validate package layout
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import os
          path = 'butterscotch_ps4.pkg'
          with open(path, 'rb') as f:
              first = f.read(16)
          print(f'package_size={os.path.getsize(path)}')
          print(f'header={first.hex()}')
          if len(first) < 8:
              raise SystemExit('PKG is too small to be valid')
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-ps4-pkg
          path: butterscotch_ps4.pkg
