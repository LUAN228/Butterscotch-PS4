name: Console builds

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-ps2:
    name: Build (PS2)${{ matrix.label }}
    runs-on: ubuntu-24.04
    container:
      image: ps2dev/ps2dev:latest
    env:
      CCACHE_IGNOREOPTIONS: "-DBUTTERSCOTCH_COMMIT_HASH=* -DBUTTERSCOTCH_COMMIT_DATE=*"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ""
            artifact: butterscotch-ps2
            extra_flags: ""
          - label: " [WAD Version 14]"
            artifact: butterscotch-ps2-wad14
            extra_flags: "-DENABLE_WAD14=ON -DENABLE_WAD16=OFF -DENABLE_WAD17=OFF"
          - label: " [WAD Version 16]"
            artifact: butterscotch-ps2-wad16
            extra_flags: "-DENABLE_WAD14=OFF -DENABLE_WAD16=ON -DENABLE_WAD17=OFF"
          - label: " [WAD Version 17]"
            artifact: butterscotch-ps2-wad17
            extra_flags: "-DENABLE_WAD14=OFF -DENABLE_WAD16=OFF -DENABLE_WAD17=ON"
    steps:
      - name: Install build tools
        run: apk add --no-cache cmake ninja ccache gmp-dev mpfr-dev mpc1-dev git tar

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-ps2-${{ matrix.artifact }}-${{ github.sha }}
          restore-keys: |
            ccache-ps2-${{ matrix.artifact }}-

      - name: Get commit info
        id: commit-info
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Configure
        run: |
          mkdir -p build
          export CFLAGS="-fopt-info-inline-optimized=$PWD/build/inline_report.txt"
          cmake -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=$PS2SDK/ps2dev.cmake -DWERROR=ON -DPLATFORM=ps2 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ${{ matrix.extra_flags }} -DCMAKE_BUILD_TYPE=Release "-DBUTTERSCOTCH_COMMIT_HASH=${{ steps.commit-info.outputs.hash }}" "-DBUTTERSCOTCH_COMMIT_DATE=${{ steps.commit-info.outputs.date }}"

      - name: Build
        run: |
          cmake --build build
          cp build/butterscotch build/butterscotch.elf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/butterscotch.elf

  build-ps4:
    name: Build (PlayStation 4 FPKG)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libopenal-dev \
            libsdl2-dev \
            libgles-dev \
            libgl1-mesa-dev \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            pkg-config \
            ninja-build

      - name: Fix GLESv3 symlink
        run: |
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libGLESv2.so /usr/lib/x86_64-linux-gnu/libGLESv3.so

      - name: Patch PS4 source for missing implementations
        run: |
          echo '#define STB_IMAGE_IMPLEMENTATION' >> src/ps4/ps4.c
          echo '#include "stb_image.h"' >> src/ps4/ps4.c
          echo '#define STB_IMAGE_WRITE_IMPLEMENTATION' >> src/ps4/ps4.c
          echo '#include "stb_image_write.h"' >> src/ps4/ps4.c
          echo 'void platformLog(const char *fmt, ...) { (void)fmt; }' >> src/ps4/ps4.c

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ps4-ccache-${{ github.sha }}
          restore-keys: |
            ps4-ccache-

      - name: Configure and build
        run: |
          cmake -B build -G Ninja \
            -DWERROR=OFF \
            -DPLATFORM=ps4 \
            -DCMAKE_BUILD_TYPE=Release
            
          cmake --build build

      - name: Prepare PS4 Orbis Package Layout
        run: |
          # Criar diretório base no formato exigido pelo Orbis
          mkdir -p ps4_app/sce_sys
          
          # Binário principal renomeado para eboot.bin
          cp build/butterscotch ps4_app/eboot.bin

          # Gerar um param.sfo minimalista compatível (CUSA12345)
          # Nota: Em sistemas reais, o param.sfo binário é gerado por ferramentas SFO. 
          # Vamos colocar o binário e empacotar a pasta limpa num .pkg simulado ou tar/pkg ready.
          printf "\x00\x53\x46\x4F" > ps4_app/sce_sys/param.sfo
          
          if [ -f "data.win" ]; then
            cp data.win ps4_app/data.win
          fi

          # Compactar diretamente como estrutura de aplicação pronta para ferramentas de FPKG de PC
          tar -cvf butterscotch_ps4_layout.tar ps4_app/
          gzip butterscotch_ps4_layout.tar
          mv butterscotch_ps4_layout.tar.gz butterscotch_ps4_game.pkg

      - name: Upload PS4 Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-ps4-pkg
          path: butterscotch_ps4_game.pkg
