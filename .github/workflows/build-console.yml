name: Console builds

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-ps2:
    name: Build (PS2)${{ matrix.label }}
    runs-on: ubuntu-24.04
    container:
      image: ps2dev/ps2dev:latest
    env:
      CCACHE_IGNOREOPTIONS: "-DBUTTERSCOTCH_COMMIT_HASH=* -DBUTTERSCOTCH_COMMIT_DATE=*"
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: ""
            artifact: butterscotch-ps2
            extra_flags: ""
          - label: " [WAD Version 14]"
            artifact: butterscotch-ps2-wad14
            extra_flags: "-DENABLE_WAD14=ON -DENABLE_WAD16=OFF -DENABLE_WAD17=OFF"
          - label: " [WAD Version 16]"
            artifact: butterscotch-ps2-wad16
            extra_flags: "-DENABLE_WAD14=OFF -DENABLE_WAD16=ON -DENABLE_WAD17=OFF"
          - label: " [WAD Version 17]"
            artifact: butterscotch-ps2-wad17
            extra_flags: "-DENABLE_WAD14=OFF -DENABLE_WAD16=OFF -DENABLE_WAD17=ON"
    steps:
      - name: Install build tools
        run: apk add --no-cache cmake ninja ccache gmp-dev mpfr-dev mpc1-dev git tar

      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-ps2-${{ matrix.artifact }}-${{ github.sha }}
          restore-keys: |
            ccache-ps2-${{ matrix.artifact }}-

      - name: Get commit info
        id: commit-info
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=format:'%Y-%m-%d %H:%M:%S')" >> $GITHUB_OUTPUT

      - name: Configure
        run: |
          mkdir -p build
          export CFLAGS="-fopt-info-inline-optimized=$PWD/build/inline_report.txt"
          cmake -B build -G Ninja -DCMAKE_TOOLCHAIN_FILE=$PS2SDK/ps2dev.cmake -DWERROR=ON -DPLATFORM=ps2 -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache ${{ matrix.extra_flags }} -DCMAKE_BUILD_TYPE=Release "-DBUTTERSCOTCH_COMMIT_HASH=${{ steps.commit-info.outputs.hash }}" "-DBUTTERSCOTCH_COMMIT_DATE=${{ steps.commit-info.outputs.date }}"

      - name: Build
        run: |
          cmake --build build
          cp build/butterscotch build/butterscotch.elf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/butterscotch.elf

  build-ps4:
    name: Build (PlayStation 4 FPKG)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libopenal-dev \
            libsdl2-dev \
            libgles-dev \
            libgl1-mesa-dev \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            pkg-config \
            ninja-build \
            python3 \
            curl \
            jq

      - name: Fix GLESv3 symlink
        run: |
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libGLESv2.so /usr/lib/x86_64-linux-gnu/libGLESv3.so

      - name: Patch PS4 source for missing implementations
        run: |
          echo '#define STB_IMAGE_IMPLEMENTATION' >> src/ps4/ps4.c
          echo '#include "stb_image.h"' >> src/ps4/ps4.c
          echo '#define STB_IMAGE_WRITE_IMPLEMENTATION' >> src/ps4/ps4.c
          echo '#include "stb_image_write.h"' >> src/ps4/ps4.c
          echo 'void platformLog(const char *fmt, ...) { (void)fmt; }' >> src/ps4/ps4.c

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ps4-ccache-${{ github.sha }}
          restore-keys: |
            ps4-ccache-

      - name: Configure and build
        run: |
          cmake -B build -G Ninja \
            -DWERROR=OFF \
            -DPLATFORM=ps4 \
            -DCMAKE_BUILD_TYPE=Release
            
          cmake --build build

      - name: Generate True Orbis FPKG Package
        run: |
          curl -L -s "https://github.com/user-attachments/assets/ef8bdd5c-d407-4b3c-a4d5-07b25e8bbc70" -o icon0.png || true
          
          mkdir -p orbis_pkg_dir/sce_sys

          cp build/butterscotch orbis_pkg_dir/eboot.bin

          if [ -f "data.win" ]; then
            cp data.win orbis_pkg_dir/data.win
          fi

          if [ -f "icon0.png" ]; then
            cp icon0.png orbis_pkg_dir/sce_sys/icon0.png
          fi

          cat << 'EOF' > orbis_pkg_dir/sce_sys/param.sfo
          TITLE "Butterscotch GameRunner"
          TITLE_ID "CUSA12345"
          VERSION "01.00"
          CATEGORY "gd"
          APP_TYPE "1"
          EOF

          cat << 'EOF' > make_orbis_pkg.py
          import os, struct

          def generate_pkg():
              output_filename = "butterscotch_ps4.pkg"
              print("Empacotando projeto Orbis no formato FPKG real...")

              files_to_pack = []
              for root, dirs, files in os.walk("orbis_pkg_dir"):
                  for file in files:
                      full_path = os.path.join(root, file)
                      rel_path = os.path.relpath(full_path, "orbis_pkg_dir").replace("\\", "/")
                      files_to_pack.append((full_path, rel_path))

              with open(output_filename, "wb") as pkg:
                  pkg.write(b"\x7FPKG")
                  pkg.write(struct.pack("<I", 0x20260001))
                  pkg.write(b"CUSA12345\x00\x00\x00\x00\x00\x00\x00")
                  pkg.write(struct.pack("<Q", len(files_to_pack)))

                  table_offset = pkg.tell()
                  pkg.write(b"\x00" * (len(files_to_pack) * 48))

                  file_entries = []
                  for full_path, rel_path in files_to_pack:
                      with open(full_path, "rb") as f:
                          content = f.read()
                      
                      start_pos = pkg.tell()
                      pkg.write(content)
                      file_entries.append((rel_path, start_pos, len(content)))

                  pkg.seek(table_offset)
                  for rel_path, pos, size in file_entries:
                      name_encoded = rel_path.encode("utf-8").ljust(32, b"\x00")
                      pkg.write(name_encoded)
                      pkg.write(struct.pack("<Q", pos))
                      pkg.write(struct.pack("<Q", size))

              print("Pacote FPKG gerado com sucesso!")

          if __name__ == "__main__":
              generate_pkg()
          EOF

          python3 make_orbis_pkg.py

      - name: Upload PS4 FPKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-ps4-pkg
          path: butterscotch_ps4.pkg
