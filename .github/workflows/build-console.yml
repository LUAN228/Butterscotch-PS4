name: Console builds

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-ps4:
    name: Build (PlayStation 4 FPKG)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies and Wine
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            libopenal-dev \
            libsdl2-dev \
            libgles-dev \
            libgl1-mesa-dev \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            pkg-config \
            ninja-build \
            python3 \
            curl \
            jq \
            wine64 \
            wine \
            wine32 \
            cabextract \
            zip \
            unzip

      - name: Fix GLESv3 symlink
        run: |
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libGLESv2.so /usr/lib/x86_64-linux-gnu/libGLESv3.so

      - name: Patch PS4 source for missing implementations
        run: |
          echo '#define STB_IMAGE_IMPLEMENTATION' >> src/ps4/ps4.c
          echo '#include "stb_image.h"' >> src/ps4/ps4.c
          echo '#define STB_IMAGE_WRITE_IMPLEMENTATION' >> src/ps4/ps4.c
          echo '#include "stb_image_write.h"' >> src/ps4/ps4.c
          echo 'void platformLog(const char *fmt, ...) { (void)fmt; }' >> src/ps4/ps4.c

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ps4-ccache-${{ github.sha }}
          restore-keys: |
            ps4-ccache-

      - name: Configure and build binary
        run: |
          cmake -B build -G Ninja \
            -DWERROR=OFF \
            -DPLATFORM=ps4 \
            -DCMAKE_BUILD_TYPE=Release
            
          cmake --build build

      - name: Download and Setup OpenOrbis Toolchain & Packaging Suite
        run: |
          curl -L -s "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.1/openorbis-sdk-windows.zip" -o openorbis_sdk.zip
          unzip -q openorbis_sdk.zip
          
          # Descarregar ferramentas de suporte do SDK para garantir o orbis-pub-cmd nativo
          curl -L -s "https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.1/openorbis-linux.tar.gz" -o openorbis_linux.tar.gz || true
          if [ -f "openorbis_linux.tar.gz" ]; then
            tar -xzf openorbis_linux.tar.gz || true
          fi

      - name: Prepare Project Structure for Orbis Compiler
        run: |
          curl -L -s "https://github.com/user-attachments/assets/ef8bdd5c-d407-4b3c-a4d5-07b25e8bbc70" -o icon0.png || true

          mkdir -p ps4_root/sce_sys
          cp build/butterscotch ps4_root/eboot.bin

          if [ -f "data.win" ]; then
            cp data.win ps4_root/data.win
          fi

          if [ -f "icon0.png" ]; then
            cp icon0.png ps4_root/sce_sys/icon0.png
          fi

          cat << 'EOF' > ps4_root/sce_sys/param.sfo
          TITLE "Butterscotch GameRunner"
          TITLE_ID "CUSA12345"
          VERSION "01.00"
          CATEGORY "gd"
          APP_TYPE "1"
          EOF

          cat << 'EOF' > project.gp4
          <?xml version="1.0" encoding="utf-8" standalone="yes"?>
          <ps4project fmt="gp4" version="1.0">
            <volume type="pkg_pkg_iso">
              <volume_info>
                <volume_type>pkg_application</volume_type>
                <content_id>IV0000-CUSA12345_00-BUTTERSCOTCH0000</content_id>
                <passcode>00000000000000000000000000000000</passcode>
              </volume_info>
              <files dir="ps4_root">
                <file targ_path="eboot.bin" orig_path="eboot.bin" />
                <file targ_path="sce_sys/param.sfo" orig_path="sce_sys/param.sfo" />
                <file targ_path="sce_sys/icon0.png" orig_path="sce_sys/icon0.png" />
              </files>
            </volume>
          </ps4project>
          EOF

      - name: Generate True FPKG via Orbis Publishing CLI
        run: |
          # Localizar o binário do orbis-pub-cmd e gerar o pacote assinado real
          if [ -f "orbis-pub-cmd.exe" ]; then
            wine orbis-pub-cmd.exe img_create project.gp4 butterscotch_ps4.pkg
          elif [ -f "bin/orbis-pub-cmd.exe" ]; then
            wine bin/orbis-pub-cmd.exe img_create project.gp4 butterscotch_ps4.pkg
          else
            find . -name "orbis-pub-cmd.exe" -exec wine {} img_create project.gp4 butterscotch_ps4.pkg \;
          fi

          ls -la butterscotch_ps4.pkg

      - name: Upload PS4 FPKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-ps4-pkg
          path: butterscotch_ps4.pkg
