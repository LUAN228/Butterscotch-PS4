name: Console builds

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-ps4:
    name: Build (PlayStation 4 FPKG)
    runs-on: ubuntu-24.04
    container:
      image: openorbis/ps4-toolchain:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ccache
        run: apt-get update && apt-get install -y ccache curl jq

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-ps4-${{ github.sha }}
          restore-keys: |
            ccache-ps4-

      - name: Configure and Build
        run: |
          cmake -B build -G Ninja \
            -DWERROR=OFF \
            -DPLATFORM=ps4 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
            
          cmake --build build

      - name: Package PFS and Build FPKG
        run: |
          # Descarregar o ícone oficial do projeto
          curl -L -s "https://github.com/user-attachments/assets/ef8bdd5c-d407-4b3c-a4d5-07b25e8bbc70" -o icon0.png || true

          mkdir -p ps4_root/sce_sys
          cp build/butterscotch ps4_root/eboot.bin

          if [ -f "data.win" ]; then
            cp data.win ps4_root/data.win
          fi

          if [ -f "icon0.png" ]; then
            cp icon0.png ps4_root/sce_sys/icon0.png
          fi

          cat << 'EOF' > ps4_root/sce_sys/param.sfo
          TITLE "Butterscotch GameRunner"
          TITLE_ID "CUSA12345"
          VERSION "01.00"
          CATEGORY "gd"
          APP_TYPE "1"
          EOF

          # Conversão para formato FSELF e empacotamento Orbis real via toolchain do container
          if command -v orbis-pub-cmd &> /dev/null; then
              cat << 'EOF' > project.gp4
              <?xml version="1.0" encoding="utf-8" standalone="yes"?>
              <ps4project fmt="gp4" version="1.0">
                <volume type="pkg_pkg_iso">
                  <volume_info>
                    <volume_type>pkg_application</volume_type>
                    <content_id>IV0000-CUSA12345_00-BUTTERSCOTCH0000</content_id>
                    <passcode>00000000000000000000000000000000</passcode>
                  </volume_info>
                  <files dir="ps4_root">
                    <file targ_path="eboot.bin" orig_path="eboot.bin" />
                    <file targ_path="sce_sys/param.sfo" orig_path="sce_sys/param.sfo" />
                    <file targ_path="sce_sys/icon0.png" orig_path="sce_sys/icon0.png" />
                  </files>
                </volume>
              </ps4project>
              EOF
              orbis-pub-cmd img_create project.gp4 butterscotch_ps4.pkg
          elif command -v pkgtool &> /dev/null; then
              pkgtool create ps4_root butterscotch_ps4.pkg
          else
              # Utilização das ferramentas nativas do container OpenOrbis para assinatura PFS
              oo-pack create --title-id CUSA12345 --content-id IV0000-CUSA12345_00-BUTTERSCOTCH0000 ps4_root butterscotch_ps4.pkg
          fi

          ls -la butterscotch_ps4.pkg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-ps4-pkg
          path: butterscotch_ps4.pkg
