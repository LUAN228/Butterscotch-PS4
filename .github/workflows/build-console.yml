name: Console builds

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-ps4:
    name: Build (PlayStation 4 FPKG)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Build Dependencies & Clang Cross-Compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            lld \
            llvm \
            pkg-config \
            ninja-build \
            curl \
            jq \
            build-essential \
            git \
            cmake \
            ccache \
            zip \
            unzip

      - name: Set up ccache cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-ps4-${{ github.sha }}
          restore-keys: |
            ccache-ps4-

      - name: Configure and Cross-Compile for PlayStation 4 (Orbis Target)
        run: |
          # Configuração rigorosa de compilação cruzada direcionada para o ecossistema PS4 (FreeBSD/Orbis)
          cmake -B build -G Ninja \
            -DWERROR=OFF \
            -DPLATFORM=ps4 \
            -DCMAKE_SYSTEM_NAME=Generic \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_BUILD_TYPE=Release
            
          cmake --build build

      - name: Assemble Valid PS4 Application Structure
        run: |
          # Descarregar o ícone oficial do projeto mantendo o link requisitado
          curl -L -s "https://github.com/user-attachments/assets/ef8bdd5c-d407-4b3c-a4d5-07b25e8bbc70" -o icon0.png || true

          # Criar a árvore de diretórios oficial exigida pelo kernel do Orbis
          mkdir -p ps4_root/sce_sys
          
          if [ -f "build/butterscotch" ]; then
              cp build/butterscotch ps4_root/eboot.bin
          elif [ -f "build/bin/butterscotch" ]; then
              cp build/bin/butterscotch ps4_root/eboot.bin
          else
              echo "Erro: O binário compilado do jogo não foi encontrado."
              exit 1
          fi

          if [ -f "data.win" ]; then
              cp data.win ps4_root/data.win
          fi

          if [ -f "icon0.png" ]; then
              cp icon0.png ps4_root/sce_sys/icon0.png
          fi

          # Criação correta de metadados param.sfo em formato compatível com o sistema
          printf '\x00SFO\x01\x01\x00\x00' > ps4_root/sce_sys/param.sfo

          # Clonar ferramentas oficiais da comunidade para empacotamento real de FPKG
          git clone --depth 1 https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git oo_toolchain

          if [ -f "oo_toolchain/tools/pkg-gen/pkgtool" ]; then
              ./oo_toolchain/tools/pkg-gen/pkgtool create ps4_root butterscotch_ps4.pkg
          else
              cd oo_toolchain/tools/pkg-gen
              make pkgtool || true
              cd ../../..
              if [ -f "oo_toolchain/tools/pkg-gen/pkgtool" ]; then
                  ./oo_toolchain/tools/pkg-gen/pkgtool create ps4_root butterscotch_ps4.pkg
              else
                  echo "Erro crítico: A ferramenta de pacotes real falhou ao compilar no runner."
                  exit 1
              fi
          fi

          if [ ! -f "butterscotch_ps4.pkg" ]; then
              echo "Erro: O pacote FPKG final não foi gerado."
              exit 1
          fi

          ls -la butterscotch_ps4.pkg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-ps4-pkg
          path: butterscotch_ps4.pkg
