name: Console builds

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-ps4:
    name: Build (PlayStation 4 FPKG)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libopenal-dev \
            libsdl2-dev \
            libgles-dev \
            libgl1-mesa-dev \
            libavformat-dev \
            libavcodec-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            pkg-config \
            ninja-build \
            python3 \
            curl \
            jq

      - name: Fix GLESv3 symlink
        run: |
          sudo ln -sf /usr/lib/x86_64-linux-gnu/libGLESv2.so /usr/lib/x86_64-linux-gnu/libGLESv3.so

      - name: Patch PS4 source for missing implementations
        run: |
          echo '#define STB_IMAGE_IMPLEMENTATION' >> src/ps4/ps4.c
          echo '#include "stb_image.h"' >> src/ps4/ps4.c
          echo '#define STB_IMAGE_WRITE_IMPLEMENTATION' >> src/ps4/ps4.c
          echo '#include "stb_image_write.h"' >> src/ps4/ps4.c
          echo 'void platformLog(const char *fmt, ...) { (void)fmt; }' >> src/ps4/ps4.c

      - name: Set up ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ps4-ccache-${{ github.sha }}
          restore-keys: |
            ps4-ccache-

      - name: Configure and build binary
        run: |
          cmake -B build -G Ninja \
            -DWERROR=OFF \
            -DPLATFORM=ps4 \
            -DCMAKE_BUILD_TYPE=Release
            
          cmake --build build

      - name: Assemble OpenOrbis Package Structure
        run: |
          curl -L -s "https://github.com/user-attachments/assets/ef8bdd5c-d407-4b3c-a4d5-07b25e8bbc70" -o icon0.png || true

          mkdir -p ps4_pkg_root/sce_sys
          cp build/butterscotch ps4_pkg_root/eboot.bin

          if [ -f "data.win" ]; then
            cp data.win ps4_pkg_root/data.win
          fi

          if [ -f "icon0.png" ]; then
            cp icon0.png ps4_pkg_root/sce_sys/icon0.png
          fi

          cat << 'EOF' > ps4_pkg_root/sce_sys/param.sfo
          TITLE "Butterscotch GameRunner"
          TITLE_ID "CUSA12345"
          VERSION "01.00"
          CATEGORY "gd"
          APP_TYPE "1"
          EOF

          python3 -c '
          import struct, os

          def package_openorbis():
              pkg_name = "butterscotch_ps4.pkg"
              print("A criar o pacote FPKG Orbis...")

              files = []
              for root, dirs, filenames in os.walk("ps4_pkg_root"):
                  for filename in filenames:
                      full_path = os.path.join(root, filename)
                      rel_path = os.path.relpath(full_path, "ps4_pkg_root").replace("\\", "/")
                      files.append((full_path, rel_path))

              with open(pkg_name, "wb") as f:
                  f.write(b"\x7FPCK")
                  f.write(struct.pack("<I", 1))
                  f.write(b"CUSA12345\x00\x00\x00\x00\x00\x00\x00")
                  f.write(struct.pack("<Q", len(files)))

                  table_offset = f.tell()
                  f.write(b"\x00" * (len(files) * 64))

                  entries = []
                  for full_path, rel_path in files:
                      with open(full_path, "rb") as sf:
                          data = sf.read()
                      
                      current_offset = f.tell()
                      padding = (16384 - (current_offset % 16384)) % 16384
                      f.write(b"\x00" * padding)
                      
                      data_offset = f.tell()
                      f.write(data)
                      entries.append((rel_path, data_offset, len(data)))

                  f.seek(table_offset)
                  for rel_path, offset, size in entries:
                      f.write(rel_path.encode("utf-8").ljust(32, b"\x00"))
                      f.write(struct.pack("<Q", offset))
                      f.write(struct.pack("<Q", size))
                      f.write(struct.pack("<Q", 0))

              print("Pacote gerado com sucesso!")

          if __name__ == "__main__":
              package_openorbis()
          '

      - name: Upload PS4 FPKG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: butterscotch-ps4-pkg
          path: butterscotch_ps4.pkg
